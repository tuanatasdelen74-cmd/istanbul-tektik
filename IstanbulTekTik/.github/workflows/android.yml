name: Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x ./IstanbulTekTik/gradlew
      
    - name: Change directory to IstanbulTekTik and Build APK
      run: |
        cd IstanbulTekTik
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: IstanbulTekTik/app/build/outputs/apk/debug/app-debug.apk
